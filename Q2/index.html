<!DOCTYPE html>
<body>
    <label for="userInput">Enter a number:</label>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button id="checkBtn" type="button">Check</button>
    <p id="result" role="status" aria-live="polite"></p>

    <script>
        const userInput = document.getElementById("userInput");
        const checkBtn = document.getElementById("checkBtn");
        const resultParagraph = document.getElementById("result");

        function checkInput() {
            const rawValue = userInput.value;

            if (rawValue.trim() === "") {
                resultParagraph.textContent = "Please enter a valid number!";
                return;
            }

            const num = Number(rawValue);

            if (isNaN(num)) {
                resultParagraph.textContent = "Please enter a valid number!";
            } else if (num < 10) {
                resultParagraph.textContent = "The number is lower than 10";
            } else if (num > 10) {
                resultParagraph.textContent = "The number is higher than 10";
            } else {
                resultParagraph.textContent = "The number is equal to 10";
            }
        }

        checkBtn.addEventListener("click", checkInput);
    </script>
</body>
</html>
